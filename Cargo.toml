[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
kurbo = "0.13"
pollster = "1.0.1"
png = "0.18"
rfd = "0.15"
skrifa = "0.44"
vello = "0.11.0"
winit = "0.30"
zune-jpeg = "0.5"

dv-core = { path = "crates/dv-core" }
dv-geom = { path = "crates/dv-geom" }
dv-render = { path = "crates/dv-render" }
dv-ui = { path = "crates/dv-ui" }

# Dev: dependencies get light optimisation so the UI and Vello stay responsive.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Release builds: smaller binaries.
[profile.release]
strip = true
